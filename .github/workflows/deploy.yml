name: Pages Deploy Test
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Print deployment info
        run: |
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}"
          echo "GITHUB_TOKEN permissions test"
          # Try to access another repo's Pages via the token
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/jekyll/jekyll/pages || true
